# Pushing a tag vX.Y.Z is the whole release. crates.io's trusted publisher is
# bound to this file name and the crates-io environment; keep both names.
name: Publish

on:
  push:
    tags: ["v*"]
  # A dry run: every check for the given tag against the dispatched commit,
  # without publishing to crates.io or creating the GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      notes: ${{ steps.check.outputs.notes }}
      published: ${{ steps.registry.outputs.published }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check that the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          .github/scripts/release-check.sh "$TAG" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            cat "$RUNNER_TEMP/notes.md"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      # The first version is published by hand (see CONTRIBUTING.md), and a
      # rerun must not fail on a version crates.io already has.
      - name: Check whether the version is already on crates.io
        id: registry
        if: steps.check.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'blazingagents/rust-sdk publish workflow' \
            "https://crates.io/api/v1/crates/blazing-agents/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::blazing-agents $VERSION is already on crates.io; skipping the upload" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
      - name: Summarize the release
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          PUBLISHED: ${{ steps.registry.outputs.published }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            crates="skipped: prereleases are not published to crates.io"
          elif [ "$PUBLISHED" = true ]; then
            crates="skipped: $VERSION is already on crates.io"
          else
            crates="publish blazing-agents $VERSION"
          fi
          {
            [ "$GITHUB_EVENT_NAME" = push ] || echo "**Dry run: nothing below is published.**"
            echo
            echo "- crates.io: $crates"
            echo "- GitHub release: $TAG (prerelease: $PRERELEASE)"
            echo
            echo "### Release notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    if: >-
      github.event_name == 'push'
      && needs.verify.outputs.prerelease == 'false'
      && needs.verify.outputs.published == 'false'
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p blazing-agents --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: Create the GitHub release
    # publish is skipped for a prerelease or a version already on crates.io;
    # the release still goes out then, but never after a failed check.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.ci.result == 'success'
      && needs.verify.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [ci, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A rerun must not fail on a release an earlier attempt already created.
      - name: Create the release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.verify.outputs.notes }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url -q .url; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "$NOTES" "${flags[@]}"
